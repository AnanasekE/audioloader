{{define "home"}}
<section>
    <form hx-post="/api/track/new" hx-encoding="multipart/form-data" hx-target="#result">
        <h1>Add song</h1>
        <input type="text" name="title">
        <input type="file" name="track">
        <button type="submit">Submit</button>
    </form>
    <span id="result"></span>
</section>
{{end}}
