root = "."
tmp_dir = "tmp"

[build]
  cmd = "make build"
  bin = "./audioloader"
  include_ext = ["go", "templ", "css"]
  exclude_dir = ["assets", "bin", "data", "tmp", ".git"]
  # generated by templ generate during the build; watching them would loop
  exclude_regex = ["_templ\\.go$"]
  delay = 300
  stop_on_error = true
  send_interrupt = true

[proxy]
  # open http://localhost:8090 for auto browser reload
  enabled = true
  proxy_port = 8090
  app_port = 8080

[log]
  time = false

[misc]
  clean_on_exit = true
